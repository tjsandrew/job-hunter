name: Pause or resume staging backend
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Backend action
        required: true
        type: choice
        default: pause
        options: [pause, resume]
permissions:
  contents: read
  id-token: write
concurrency:
  group: staging-release
  cancel-in-progress: false
jobs:
  control:
    if: github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != '' && vars.API_FUNCTION != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AWS_REGION: ap-southeast-1
      API_FUNCTION: ${{ vars.API_FUNCTION }}
      # Pauses the embedding worker and the job pull with the API when they exist (empty otherwise).
      EMBED_FUNCTION: ${{ vars.EMBED_FUNCTION }}
      DISCOVERY_FUNCTION: ${{ vars.DISCOVERY_FUNCTION }}
      BACKEND_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -c backend/requirements.lock boto3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1
      - name: Apply and verify selected mode
        run: python scripts/backend_control.py "$BACKEND_MODE" >> "$GITHUB_STEP_SUMMARY"
