name: Local POC checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      backend: ${{ steps.filter.outputs.backend }}
      package: ${{ steps.filter.outputs.package }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: python3 scripts/ci_changes.py
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start disposable PostgreSQL and API
        run: docker compose up --build -d api
      - name: Wait for API startup
        run: |
          for attempt in $(seq 1 40); do
            if curl -fsS http://localhost:8000/v1/health; then exit 0; fi
            sleep 2
          done
          docker compose logs api db
          exit 1
      - name: Unit and PostgreSQL integration tests
        run: >-
          docker compose run --rm --no-deps
          -e RUN_DB_INTEGRATION=1
          -v "$PWD/backend/tests:/app/tests:ro"
          -v "$PWD/contracts:/app/contracts:ro"
          api sh -c 'pip install -c requirements.lock ".[test]" && pytest /app/tests -q'
      - name: Migration check (old schema to head, ORM columns all migrated)
        run: >-
          docker compose run --rm --no-deps
          -v "$PWD/scripts:/app/scripts:ro"
          api python /app/scripts/check_profile_bank_migration.py
      - name: HTTP smoke test
        run: python3 scripts/smoke.py
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=100 api db
      - name: Clean up disposable CI services
        if: always()
        run: docker compose down --volumes

  lambda-package:
    needs: changes
    if: needs.changes.outputs.package == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build production ARM64 Lambda image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.lambda
          platforms: linux/arm64
          provenance: false
          load: true
          push: false
          tags: jobhunter-lambda:check
          cache-from: type=gha,scope=jobhunter-lambda
          cache-to: type=gha,mode=max,scope=jobhunter-lambda
      - name: Verify handlers, certificates and PDF fonts
        run: >-
          docker run --rm --entrypoint python jobhunter-lambda:check
          -c 'from pathlib import Path; from job_hunter.adapters.aws_config import RDS_CA; from job_hunter.api.lambda_handler import handler; from job_hunter.migrate_aws import handler as migrate; from job_hunter.preparation import rendering; assert Path(RDS_CA).is_file(); assert list(Path(rendering.__file__).parent.glob("fonts/*.ttf"))'
  scripts:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -c backend/requirements.lock boto3
      - run: python -m unittest discover -s scripts/tests -v

  gate:
    name: Checks passed
    if: always()
    needs: [changes, web, backend, lambda-package, scripts]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: >-
          python3 -c 'import json,os,sys; results=json.loads(os.environ["RESULTS"]); failed=[name for name,result in results.items() if result["result"] not in ("success","skipped")]; sys.exit("Failed or cancelled checks: " + ", ".join(failed) if failed else 0)'
