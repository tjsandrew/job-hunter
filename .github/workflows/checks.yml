name: Local POC checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start disposable PostgreSQL and API
        run: docker compose up --build -d api
      - name: Wait for API startup
        run: |
          for attempt in $(seq 1 40); do
            if curl -fsS http://localhost:8000/v1/health; then exit 0; fi
            sleep 2
          done
          docker compose logs api db
          exit 1
      - name: Unit and PostgreSQL integration tests
        run: >-
          docker compose run --rm --no-deps
          -e RUN_DB_INTEGRATION=1
          -v "$PWD/backend/tests:/app/tests:ro"
          api sh -c 'pip install -c requirements.lock ".[test]" && pytest /app/tests -q'
      - name: HTTP smoke test
        run: python3 scripts/smoke.py
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=100 api db
      - name: Clean up disposable CI services
        if: always()
        run: docker compose down --volumes
