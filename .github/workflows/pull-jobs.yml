name: Pull jobs
# Loads a few new public job postings into the staging database (docs/design/04-JOB-INGESTION.md). It wakes Aurora (which pauses
# when idle), so run it when you need jobs, not on a loop. Run it from main, like the other staging workflows.
on:
  workflow_dispatch:
    inputs:
      max_new:
        description: How many NEW jobs to add in this run
        required: true
        default: '100'
permissions:
  contents: read
  id-token: write
concurrency:
  group: staging-release
  cancel-in-progress: false
jobs:
  pull:
    if: github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != '' && vars.DISCOVERY_FUNCTION != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_REGION: ap-southeast-1
      DISCOVERY_FUNCTION: ${{ vars.DISCOVERY_FUNCTION }}
      API_FUNCTION: ${{ vars.API_FUNCTION }}
      MAX_NEW: ${{ inputs.max_new }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -c backend/requirements.lock boto3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1
      - name: Pull jobs and report what was added
        run: python scripts/pull_jobs.py >> "$GITHUB_STEP_SUMMARY"
