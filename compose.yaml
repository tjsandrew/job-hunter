name: job-hunter
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: jobhunter
      POSTGRES_USER: jobhunter
      POSTGRES_PASSWORD: jobhunter
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/local/init-db.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U jobhunter -d jobhunter']
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      APP_ENV: local
      AUTH_MODE: local
      DATABASE_URL: postgresql+psycopg://jobhunter_app:jobhunter_app@db:5432/jobhunter
      MIGRATION_DATABASE_URL: postgresql+psycopg://jobhunter:jobhunter@db:5432/jobhunter
      STORAGE_ROOT: /data
      PDF_STORAGE_DIR: /data/exports
      MODEL_BACKEND: ${MODEL_BACKEND:-heuristic}
      FOR_YOU_ENABLED: ${FOR_YOU_ENABLED:-1}
      EMBED_ON_SAVE: ${EMBED_ON_SAVE:-1}
      EMBEDDER_URL: ${EMBEDDER_URL:-http://embedder:8100}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
    command: >-
      sh -c 'alembic upgrade head &&
      DATABASE_URL=$$MIGRATION_DATABASE_URL python -m job_hunter.seed &&
      uvicorn job_hunter.api.main:app --host 0.0.0.0 --port 8000'
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - document_data:/data
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./apps/web
    ports:
      - '127.0.0.1:5173:5173'
    environment:
      VITE_API_BASE_URL: /v1
      API_PROXY_TARGET: http://api:8000
    depends_on:
      api:
        condition: service_healthy
  embedder:
    # Starts with the rest of the stack (about 700 MB image, ~210 MiB memory). The api does not wait for it:
    # embedding failures never fail a save, and /v1/recommendations/for-you falls back to the keyword ranker.
    # Standalone text -> 512-d vector service; see services/embedder/CONTRACT.md.
    build: ./services/embedder
    environment:
      EMBEDDER_SERVICE_BACKEND: ${EMBEDDER_SERVICE_BACKEND:-fastembed}
    ports:
      - '127.0.0.1:8100:8100'
volumes:
  postgres_data:
  document_data:
