[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "embedder-service"
version = "0.1.0"
description = "Standalone, backend-pluggable text embedding service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "fastembed>=0.4,<1",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.34,<2"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not real_model'"
markers = ["real_model: loads the real embedding model (slow; needs model cache or network)"]

[tool.ruff]
line-length = 100
