[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-hunter-backend"
version = "0.1.0"
description = "Local-first Job Hunter API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "pydantic-settings>=2.5,<3",
  "reportlab>=4.2,<5",
  "pgvector>=0.3,<1",
  "pypdf>=5.0,<7",
  "pdfplumber>=0.11,<1",
  "jsonschema>=4,<5",
  "python-docx>=1.1,<2",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]  # "." lets tests share helpers via `tests.…` imports
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.setuptools.package-data]
"job_hunter.preparation" = ["fonts/*.ttf", "fonts/*.md", "fonts/*.txt"]

"job_hunter.profile_bank.importing" = ["*.json"]
